[project]
name = "murmur"
version = "0.1.0"
description = "Facebook Messenger AI bridge for LiteLLM, OpenWebUI, and Lobe mirroring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9.0",
  "cryptography>=42.0.0",
  "curl_cffi>=0.15.0",
  "fbchat-muqit>=1.2.2",
  "psycopg[binary]>=3.2.0",
  "PySocks>=1.7.1",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
facebook-login = [
  "cloakbrowser>=0.3.28",
  "playwright>=1.45.0",
]

[project.scripts]
murmur = "murmur.app:main"

[tool.setuptools.packages.find]
include = ["murmur*"]
