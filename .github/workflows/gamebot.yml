name: GameBot — Free Games RSS

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore seen-games cache
        uses: actions/cache@v4
        with:
          path: seen-games.json
          key: gamebot-seen-${{ github.run_id }}
          restore-keys: |
            gamebot-seen-

      - name: Poll RSS and notify Murmur
        env:
          MURMUR_WEBHOOK_URL: ${{ secrets.MURMUR_WEBHOOK_URL }}
          MURMUR_THREAD_ID: ${{ secrets.MURMUR_THREAD_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEEN_FILE: seen-games.json
        run: node scripts/gamebot/poll-rss.js

      - name: Save seen-games cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: seen-games.json
          key: gamebot-seen-${{ github.run_id }}