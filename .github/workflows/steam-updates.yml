name: Steam Updates — Game Patch News

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore seen-updates cache
        uses: actions/cache@v4
        with:
          path: seen-steam-updates.json
          key: steam-updates-seen-${{ github.run_id }}
          restore-keys: |
            steam-updates-seen-

      - name: Poll Steam news and notify Murmur
        env:
          MURMUR_WEBHOOK_URL: ${{ secrets.MURMUR_WEBHOOK_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GAME_APPIDS: "3527290:PEAK"
          SEEN_FILE: seen-steam-updates.json
        run: node scripts/gamebot/poll-steam-updates.js

      - name: Save seen-updates cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: seen-steam-updates.json
          key: steam-updates-seen-${{ github.run_id }}
